site_name: Modelagem Dinâmica Espacial
site_description: Proposta de disciplina de pós-graduação (LambdaGeo/UFMA) — de autômatos celulares a modelos de mudança de uso da terra, com DisSModel, DisSCube e DisSLUCC.
site_author: Sérgio Souza Costa
copyright: LambdaGeo · UFMA
site_url: https://lambdageo-edu.github.io/curso-modelagem-dinamica-espacial/
repo_url: https://github.com/lambdageo-edu/curso-modelagem-dinamica-espacial
repo_name: lambdageo-edu/curso-modelagem-dinamica-espacial
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro

plugins:
  - search:
      lang: pt
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início: index.md
  - A disciplina:
      - Cronograma: cronograma.md
      - Metodologia e ambiente: metodologia.md
      - Avaliação e projeto: avaliacao.md
      - Bibliografia: bibliografia.md
  - Encontros:
      - encontros/index.md
      - "1. Fundamentos": encontros/01-notas.md
      - "2. Python I": notebooks/encontro02_python_basico.ipynb
      - "3. Python II: dados espaciais": notebooks/encontro03_python_dados_espaciais.ipynb
      - "4. Reprodutibilidade e o DisSModel": notebooks/encontro04_reprodutibilidade.ipynb
      - "5. Dinâmica de sistemas": notebooks/encontro05_dinamica_sistemas.ipynb
      - "6. Autômatos celulares": notebooks/encontro06_automatos_celulares.ipynb
      - "7. Agentes e acoplamento": notebooks/encontro07_agentes_acoplamento.ipynb
      - "8. Modelos de mudança da terra":
          - Notas de aula: encontros/08-notas.md
          - Ficha de leitura: encontros/08-ficha.md
      - "9. LUCC com o DisSLUCC": notebooks/encontro09_disslucc.ipynb
      - "10. Dados com o DisSCube": notebooks/encontro10_disscube.ipynb
      - "11. Potencial, alocação e restrições": notebooks/encontro11_potencial_alocacao.ipynb
      - "12. Incerteza e sensibilidade": notebooks/encontro12_incerteza_sensibilidade.ipynb
      - "13. Validação e oficina de projeto": notebooks/encontro13_validacao.ipynb
